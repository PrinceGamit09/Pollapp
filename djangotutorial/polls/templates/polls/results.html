{% extends "polls/base.html" %}

{% block content %}
  <h2>Results for {{ question.question_text }}</h2>
  <ul>
    {% for choice in question.choice_set.all %}
      <li>{{ choice.choice_text }} — {{ choice.votes }} votes</li>
    {% endfor %}
  </ul>
  <a href="{% url 'detail' question.id %}">Vote again?</a>
{% endblock %}
